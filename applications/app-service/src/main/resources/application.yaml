server:
  port: 8080
spring:
  application:
    name: "FranchiseApi"
  devtools:
    add-properties: false
  profiles:
    include: null
  sql:
    init:
      mode: never
springdoc:
  swagger-ui.path: "/v3/swagger-ui.html"
  api-docs.path: "/v3/api-docs"
  show-actuator: true
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
adapters:
  r2dbc:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:franchise_db}
    schema: ${DB_SCHEMA:public}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
